name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  luarocks-release:
    name: LuaRocks release
    runs-on: ubuntu-latest
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
    steps:
      - name: Checkout
        if: env.LUAROCKS_API_KEY != ''
        uses: actions/checkout@v7

      - name: LuaRocks upload
        if: env.LUAROCKS_API_KEY != ''
        uses: nvim-neorocks/luarocks-tag-release@v7
